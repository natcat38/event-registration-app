<!doctype html>
<!--
  Source of public/og-image.png (1200 x 630). To regenerate: open this file in a browser from the frontend/ folder
  (so the font path below resolves), set the viewport to 1200 x 630, and screenshot the page.
  Colours are the app's own: the MUI primary blue (#1976d2) and white.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: Roboto;
        font-weight: 700;
        src: url(../node_modules/@fontsource/roboto/files/roboto-latin-700-normal.woff2);
      }
      @font-face {
        font-family: Roboto;
        font-weight: 400;
        src: url(../node_modules/@fontsource/roboto/files/roboto-latin-400-normal.woff2);
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #1976d2;
        color: #fff;
        font-family: Roboto, sans-serif;
      }
      main {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 0 96px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      h1 {
        margin: 0;
        font-size: 120px;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.01em;
      }
      p {
        margin: 32px 0 0;
        font-size: 40px;
        font-weight: 400;
        line-height: 1.35;
        max-width: 900px;
      }
      .bar {
        width: 120px;
        height: 12px;
        background: #fff;
        margin-bottom: 40px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="bar"></div>
      <h1>Event Registration</h1>
      <p>Register for events with limited seats, and see how fast each one is filling.</p>
    </main>
  </body>
</html>
